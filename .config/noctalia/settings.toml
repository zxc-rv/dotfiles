config_version = 11

[audio]
enable_sounds = true

[bar]
order = [ "default" ]

    [bar.default]
    background_opacity = 0.79999998211860657
    center = [ "clock", "weather" ]
    concave_edge_corners = false
    end = [ "tray", "keyboard_layout", "input_volume", "volume", "notifications", "session" ]
    font_family = "SF Pro"
    margin_ends = 0
    padding = 12
    radius = 0
    shadow = false
    start = [ "workspaces", "media", "taskbar" ]
    thickness = 31
    widget_spacing = 16

        [bar.default.monitor.DP-1]
        start = [ "workspaces", "group:g1", "group:g2", "group:g3" ]

            [[bar.default.monitor.DP-1.capsule_group]]
            enabled = true
            fill = "surface_variant"
            foreground = "#A6E3A1"
            id = "g2"
            members = [ "GPU_Load", "GPU_Temp" ]
            opacity = 1.0
            padding = 6.0

            [[bar.default.monitor.DP-1.capsule_group]]
            enabled = true
            fill = "surface_variant"
            foreground = "#B4BEFE"
            id = "g1"
            members = [ "cpu", "CPU_Temp" ]
            opacity = 1.0
            padding = 6.0

            [[bar.default.monitor.DP-1.capsule_group]]
            enabled = true
            fill = "surface_variant"
            foreground = "#EED49F"
            id = "g3"
            members = [ "ram", "Disk" ]
            opacity = 1.0
            padding = 6.0

[control_center]
sidebar = "none"
sidebar_section = "none"

    [control_center.calendar]
    show_events_card = false

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "notification"

    [[control_center.shortcuts]]
    type = "power_profile"

[dock]
background_opacity = 0.79999998211860657

[location]
address = "Moscow, Russia"

[lockscreen]
monitors = [ "DP-2" ]

