[notification]
background_opacity = 0.79999998211860657

[osd]
background_opacity = 0.79999998211860657
offset_y = 100
position = "bottom_center"

    [osd.kinds]
    keyboard_layout = false

[shell]
clipboard_enabled = false
corner_radius_scale = 0.0
font_family = "Inter Medium"
lang = "ru"
polkit_agent = true

    [shell.panel]
    control_center_placement = "floating"
    open_near_click_clipboard = true
    open_near_click_control_center = true
    open_near_click_wallpaper = true
    session_placement = "floating"
    session_position = "center"
    transparency_mode = "glass"
    wallpaper_placement = "floating"

    [shell.session]
    grid_columns = 2
    show_shortcuts = false

        [[shell.session.actions]]
        action = "lock"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "1"
        variant = "default"

        [[shell.session.actions]]
        action = "logout"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "2"
        variant = "default"

        [[shell.session.actions]]
        action = "reboot"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "3"
        variant = "default"

        [[shell.session.actions]]
        action = "shutdown"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "4"
        variant = "destructive"

[theme]
builtin = "Tokyo-Night"
community_palette = "Tokyo Night Moon"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "hyprland", "mango", "niri", "qt" ]
    community_ids = [ "yazi" ]

[wallpaper]
directory = "/home/rv/Изображения/Wallpapers"

    [wallpaper.default]
    path = "/home/rv/Изображения/Wallpapers/misc/wallhaven-d6e1pg.jpg"

    [wallpaper.last]
    path = "/home/rv/Изображения/Wallpapers/misc/anime-girl-horn-hd-wallpaper-uhdpaper.com-132@5@h.jpg"

    [wallpaper.monitors.DP-1]
    path = "/home/rv/Изображения/Wallpapers/misc/anime-girl-horn-hd-wallpaper-uhdpaper.com-132@5@h.jpg"

    [wallpaper.monitors.DP-2]
    path = "/home/rv/Изображения/Wallpapers/misc/wallhaven-d6e1pg.jpg"

[widget.CPU_Temp]
show_value = true
stat = "cpu_temp"
type = "sysmon"
visualization = "none"

[widget.Disk]
show_value = true
stat = "disk_free"
type = "sysmon"
visualization = "none"

[widget.GPU_Load]
show_value = true
stat = "gpu_usage"
type = "sysmon"
visualization = "none"

[widget.GPU_Temp]
show_value = true
stat = "gpu_temp"
type = "sysmon"
visualization = "none"

[widget.clock]
format = "{:%A %H:%M}"

[widget.cpu]
display = "text"
glyph = "cpu"

[widget.input_volume]
color = "#A6E3A1"

[widget.keyboard_layout]
color = "#EED49F"

[widget.media]
hide_when_no_media = true

[widget.ram]
display = "text"
glyph = "blocks"

[widget.session]
color = "#ED8796"

[widget.volume]
color = "#A6E3A1"

[widget.weather]
color = "#B4BEFE"
show_condition = false

[widget.workspaces]
active_pill_size = 1.1000000000000001
capsule_radius = 4
empty_color = "surface_variant"
focused_output_only = true
inactive_pill_size = 1.1000000000000001
label_source = "name"
max_label_chars = 6
occupied_color = "#866FAF"
scale = 1.1000000000000001